<body>

<div class="layout">

<script>
'use strict';
/* ============ Utilidades ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const canon=s=>strip(s).toLowerCase().replace(/[-–—_.,;:]+/g,' ').replace(/\s+/g,' ').trim();
const PART=new Set(['de','del','la','las','los','el','y','e','da','do','dos']);
const titulo=s=>String(s||'').toLowerCase().replace(/[\p{L}\p{N}]+/gu,(w,off)=>(off>0&&PART.has(w))?w:w[0].toUpperCase()+w.slice(1));
const dash='<span class="dash">—</span>';
/* color de la etiqueta del responsable según su nombre de pila (Marcos, Marta…) */
const pillCls=v=>titulo(String(v||'').trim().split(/\s+/)[0]||'');
const val=v=>(v===''||v==null)?dash:esc(v);
const pad2=n=>String(n).padStart(2,'0');
const fmtFecha=iso=>iso?iso.split('-').reverse().join('/'):'';
const fmtH=h=>h==null||h===''?'':String(h).replace('.',',')+' h';
const eq=(a,b)=>(a??'')===(b??'');
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2000);}

/* Significado de los códigos de la columna OBS. (para que salga al pasar el ratón), p. ej. {'INT':'…'} */
const OBS_LEYENDA={};
const MOTIVOS=['Enfermedad','Excedencia'];
const LOCALIDADES={'merida':'Mérida','caceres':'Cáceres','alcantara':'Alcántara','malpartida de caceres':'Malpartida de Cáceres'};
const CONTRATOS={'100':'100 - Ordinario indefinido','189':'189 - Transformación a indefinido','300':'300 - Indefinido fijo discontinuo','406':'406 - Fondos europeos','410':'410 - De interinidad'};

/* ============ Lectura de los Excel ============ */
const hnorm=s=>strip(s).toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
const HEAD={'PUESTO G E':'puestoGE','NOMBRE':'nombre','COD':'cod','OBS':'obs','FECHA':'obsFecha','MAIL':'mail','MOVIL':'movil','DNI':'dni',
 'PUESTO TRABAJO':'puesto','GRUPO':'grupo','CENTRO DE TRABAJO':'centro','DIRECCION':'direccion','FESTIVO LOCAL':'localidad',
 'PUESTO PREVENCION':'prevencion','HORAS':'horas','TIPO DE CONTRATO':'contrato','COORDINACION':'coord','ENCARGO':'encargo','ACCION':'accion',
 'NOMBRE2':'nombre2','TITULACION':'titulacion','TELETRABAJO':'teletrabajo','TARIFA':'tarifa','EXPEDIENTE':'expediente','NOMBRE ENCARGO':'nombreEncargo','FECHA FIN':'fechaFin'};
function txt(v){
  if(v==null)return '';
  if(typeof v==='number')return v===0?'':String(v);
  const s=String(v).replace(/[\t\u00a0]+/g,' ').replace(/\s+/g,' ').trim();
  return s==='0'?'':s;
}
function fecha(v){
  if(v===''||v==null)return '';
  if(typeof v==='number'){ if(v<20000)return ''; return new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10); }
  const s=String(v).replace(/\s/g,'');
  let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){let y=+m[3]; if(y<100)y+=2000; return `${y}-${pad2(m[2])}-${pad2(m[1])}`;}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  if(/^\d+$/.test(s))return fecha(+s);
  return '';
}
/* ============ Base de datos compartida (Firebase, colección gf_adscripciones) ============ */
const firebaseConfig={apiKey:"AIzaSyC4GTuNF806rml_rfzwvzkr_rqucfzijxo",authDomain:"cuadrante-secona.firebaseapp.com",projectId:"cuadrante-secona",
 storageBucket:"cuadrante-secona.firebasestorage.app",messagingSenderId:"175128885677",appId:"1:175128885677:web:be910a122535a9bd4cc924"};
const COL='gf_adscripciones';
let fdb=null, BASE=[];
const dmy=iso=>iso?iso.split('-').reverse().join('/'):'';
const numOrNull=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)&&n>0?n:null;};
/* documento de la base de datos → registro de esta consulta */
function fromDoc(id,d){

$('#tbody').addEventListener('keydown',e=>{ if(e.key==='Enter'){const tr=e.target.closest('tr'); if(tr)openDrawer(tr.dataset.id);} });
$('#empty').addEventListener('click',e=>{ const a=e.target.dataset.act; if(a==='limpiar')limpiar(); });
let qT;
$('#q').addEventListener('input',e=>{ clearTimeout(qT); qT=setTimeout(()=>{ S.q=e.target.value; S.terms=canon(S.q).split(' ').filter(Boolean); render(); },120); });
$('.seg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; S.resp=b.dataset.resp; render(); });

/* Columnas */
function colMenuHTML(){
  const nOn=S.order.filter(id=>S.cols.has(id)).length;
  return '<div class="cm-h">Mostrar y ordenar columnas</div>'+
    `<div class="cm-all"><button type="button" class="btn sm" data-all="1" ${nOn===S.order.length?'disabled':''}>Marcar todas</button><button type="button" class="btn sm" data-all="0" ${nOn===0?'disabled':''}>Desmarcar todas</button></div>`+
    COLS.filter(c=>c.fixed).map(c=>`<div class="cm-row fixed"><span class="cm-grip off" aria-hidden="true">⠿</span><label><input type="checkbox" checked disabled>${esc(c.label)}</label><span class="cm-fx">fija</span></div>`).join('')+
    S.order.map((id,i)=>{ const c=COLS.find(x=>x.id===id); return `<div class="cm-row" data-id="${id}"><span class="cm-grip" title="Arrastra para mover" aria-hidden="true">⠿</span><label><input type="checkbox" value="${id}" ${S.cols.has(id)?'checked':''}>${esc(c.label)}</label>`+
      `<button type="button" class="cm-mv" data-mv="-1" aria-label="Subir ${esc(c.label)}" ${i===0?'disabled':''}>↑</button><button type="button" class="cm-mv" data-mv="1" aria-label="Bajar ${esc(c.label)}" ${i===S.order.length-1?'disabled':''}>↓</button></div>`; }).join('')+
    '<div class="cm-f"><button type="button" class="btn sm" data-reset>Restablecer orden</button></div>';
}
function refreshColMenu(){ const m=$('#colMenu'); if(m){ const st=m.scrollTop; m.innerHTML=colMenuHTML(); m.scrollTop=st; } }
$('#btnCols').addEventListener('click',e=>{
  let m=$('#colMenu'); if(m){m.remove();return;}
  m=document.createElement('div'); m.id='colMenu'; m.innerHTML=colMenuHTML();
  const r=e.currentTarget.getBoundingClientRect(); m.style.left=Math.max(8,Math.min(r.left,innerWidth-290))+'px'; m.style.top=(r.bottom+4)+'px';
  m.addEventListener('change',ev=>{ ev.target.checked?S.cols.add(ev.target.value):S.cols.delete(ev.target.value); lsSet('cp_cols2',[...S.cols]); renderTable();
    const nOn=S.order.filter(id=>S.cols.has(id)).length; const a=$('#colMenu [data-all="1"]'), z=$('#colMenu [data-all="0"]'); if(a)a.disabled=nOn===S.order.length; if(z)z.disabled=nOn===0; });
  /* Arrastrar filas del menú por el asa (ratón y pantalla táctil) */
  m.addEventListener('pointerdown',ev=>{
    const g=ev.target.closest('.cm-grip:not(.off)'); if(!g)return; ev.preventDefault();
    const row=g.closest('.cm-row'), id=row.dataset.id; row.classList.add('dragging'); try{g.setPointerCapture(ev.pointerId);}catch{}
    let target=null, after=false;
    const clear=()=>$$('#colMenu .cm-row').forEach(x=>x.classList.remove('drop-before','drop-after'));
    const move=e=>{
      const el=document.elementFromPoint(e.clientX,e.clientY), t=el&&el.closest('#colMenu .cm-row[data-id]'); clear(); target=null;
      const mr=m.getBoundingClientRect(); if(e.clientY<mr.top+30)m.scrollTop-=12; else if(e.clientY>mr.bottom-30)m.scrollTop+=12;
      if(!t||t===row)return; const r=t.getBoundingClientRect(); after=e.clientY>r.top+r.height/2; target=t; t.classList.add(after?'drop-after':'drop-before');
    };
    const up=()=>{
      document.removeEventListener('pointermove',move); document.removeEventListener('pointerup',up); document.removeEventListener('pointercancel',up);
      row.classList.remove('dragging'); clear();
      if(target){ const from=S.order.indexOf(id); let to=S.order.indexOf(target.dataset.id)+(after?1:0); if(from<to)to--; moveCol(id,to); renderTable(); refreshColMenu(); toast('Orden de columnas actualizado'); }
    };
    document.addEventListener('pointermove',move); document.addEventListener('pointerup',up); document.addEventListener('pointercancel',up);
  });
  m.addEventListener('click',ev=>{
    if(ev.target.closest('[data-mv],[data-reset],[data-all]'))ev.stopPropagation(); // el menú se redibuja: que no se cierre
    const al=ev.target.closest('[data-all]'); if(al){ if(al.dataset.all==='1')S.order.forEach(id=>S.cols.add(id)); else S.cols.clear();
      lsSet('cp_cols2',[...S.cols]); renderTable(); refreshColMenu(); return; }
    const b=ev.target.closest('[data-mv]'); if(b){ const id=b.closest('.cm-row').dataset.id; moveCol(id,S.order.indexOf(id)+(+b.dataset.mv)); renderTable(); refreshColMenu();
      const nb=$(`#colMenu .cm-row[data-id="${id}"] [data-mv="${b.dataset.mv}"]`); if(nb&&!nb.disabled)nb.focus(); return; }
    if(ev.target.closest('[data-reset]')){ S.order=[...MOVABLE]; saveOrder(); renderTable(); refreshColMenu(); toast('Orden restablecido'); }
  });
  document.body.appendChild(m);
});

/* ============ Ficha lateral (consulta y edición) ============ */
const DL={puesto:'puesto',centro:'centro',localidad:'localidad',contrato:'contrato',coord:'coord',teletrabajo:'teletrabajo',prevencion:'prevencion',obs:'obs',encargoKey:'encargo'};
/* [campo, etiqueta, tipo(t texto, d fecha, n número, g grupo), opciones] */
const SECCIONES=[
 ['Identificación',[['nombre','Nombre','t',{soloEdicion:1}],['puestoGE','Puesto G.E.','t',{copy:1}],['cod','Código','t'],['obs','Observación','t'],['obsFecha','Fecha obs.','d',{soloSiObs:1}]]],
 ['Contacto',[['mail','Correo','t',{copy:1,href:'mailto:'}],['movil','Móvil','t',{copy:1,href:'tel:'}],['dni','DNI','t',{copy:1}]]],
 ['Puesto',[['puesto','Puesto de trabajo','t'],['grupo','Grupo','g'],['horas','Jornada (horas)','n'],['contrato','Tipo de contrato','t'],['teletrabajo','Teletrabajo','t'],['titulacion','Titulación','t']]],
 ['Centro de trabajo',[['centro','Centro','t'],['direccion','Dirección','t'],['localidad','Festivo local','t']]],
 ['Encargo',[['encargoKey','Encargo','t',{ro:1}],['encargoNombre','Acción','t',{ro:1}],['nombreEncargo','Nombre del encargo','t',{ro:1}],['expediente','Expediente','t',{ro:1}],['fechaFin','Fin del encargo','d',{ro:1}],['coord','Coordinación','t']]],
 ['Prevención',[['prevencion','Puesto prevención','t'],['tarifa','Tarifa EPI','t']]]
];
function viewVal(r,k){
  if(k==='horas')return fmtH(r.horas);
  if(k==='obsFecha'||k==='fechaFin')return fmtFecha(r[k]);
  if(k==='obs')return r.obs?(r.obs+(OBS_LEYENDA[r.obs]?' – '+OBS_LEYENDA[r.obs]:'')):'';
  return r[k];
}
function field(r,[k,label,tp,o={}],E){
  if(o.soloEdicion&&!E)return '';
  if(o.soloSiObs&&!E&&!r.obs)return '';
  if(!E||o.ro){
    const v=viewVal(r,k);
    if(v===''||v==null)return `<dt>${label}</dt><dd><span class="v">${dash}</span></dd>`;
    let h=esc(v); if(o.href)h=`<a href="${esc(o.href+v)}">${h}</a>`;
    return `<dt>${label}</dt><dd><span class="v">${h}</span>${o.copy?`<button class="cp" type="button" data-copy="${esc(v)}">Copiar</button>`:''}</dd>`;
  }
  const v=r[k]??''; let inp;
  if(tp==='d')inp=`<input type="date" name="${k}" value="${esc(v)}">`;
  else if(tp==='n')inp=`<input type="text" inputmode="decimal" name="${k}" value="${esc(v)}">`;
  else if(tp==='g')inp=`<select name="${k}">${['','A','B','C','D'].map(x=>`<option value="${x}" ${x===v?'selected':''}>${x||'—'}</option>`).join('')}</select>`;
  else inp=`<input type="text" name="${k}" value="${esc(v)}" ${DL[k]?`list="dl-${DL[k]}"`:''}>`;
  return `<dt><label for="f-${k}">${label}</label></dt><dd>${inp.replace('name=',`id="f-${k}" name=`)}</dd>`;
}
function compSection(r,E){
  if(!r.compartido.length)return '';
  const otros=r.compartido.map(o=>`<div><button class="linklike" type="button" data-open="${o.id}">${esc(o.nombre)}</button> ${rolTag(o)} <span class="pill ${esc(pillCls(o.resp))}">${esc(o.resp)}</span></div>`).join('');
  const aviso=`<p style="margin:0 0 6px;color:var(--apagado)">Este puesto G.E. figura con más de una persona.</p>`;
  if(!E){
    return `<section><h3>Puesto compartido</h3><div class="comp-box">${aviso}
      <dl><dt>Esta persona</dt><dd><span class="v">${rolTag(r)||'<span class="dash">Sin determinar</span>'}</span></dd>
      <dt>Motivo</dt><dd><span class="v">${r.motivoEf?esc(r.motivoEf):'<span class="dash">Sin indicar (se puede añadir en modo edición)</span>'}</span></dd></dl></div>${otros}</section>`;
  }
  return `<section><h3>Puesto compartido</h3><div class="comp-box">${aviso}${otros}</div><dl>
    <dt><label for="f-rol">Rol</label></dt><dd><select id="f-rol" name="rol">
      <option value="" ${!r.rol?'selected':''}>Automático</option>
      <option value="titular" ${r.rol==='titular'?'selected':''}>Titular</option>
      <option value="sustituto" ${r.rol==='sustituto'?'selected':''}>Sustituto</option></select></dd>
    <dt><label for="f-motivo">Motivo</label></dt><dd><input id="f-motivo" type="text" name="motivo" value="${esc(r.motivoEf)}" list="dl-motivo" placeholder="Enfermedad, excedencia…"></dd></dl>
    <p style="margin:6px 0 0;color:var(--apagado);font-size:12.5px">El motivo se aplica a todas las personas de este puesto. Rol «Automático»: sustituto si el contrato es 410 u observación INT.</p></section>`;
}
function renderDrawer(){
  const r=ALL.find(x=>x.id===S.cur), d=$('#drawer'); if(!r){closeDrawer();return;}
  const i=LIST.findIndex(x=>x.id===r.id), E=S.edit, ne=editado(r)?Object.keys(r.orig).length:0;
  d.innerHTML=`<form id="editForm" autocomplete="off">
  <div class="dh ${r.rolEf==='titular'?'titular':''}">
    <div class="row1">
      <button class="ib" type="button" data-nav="-1" aria-label="Anterior" ${(E||i<=0)?'disabled':''}>‹</button>
      <button class="ib" type="button" data-nav="1" aria-label="Siguiente" ${(E||i<0||i>=LIST.length-1)?'disabled':''}>›</button>
      <span class="sp"></span>
      <span class="pill ${esc(pillCls(r.resp))}">${esc(r.resp)}</span>
      ${E?'':'<button class="ib txt" type="button" data-edit>✎ Editar</button>'}
      <button class="ib" type="button" data-close aria-label="Cerrar ficha">×</button>
    </div>
    ${E?`<input type="text" name="nombre" aria-label="Nombre" value="${esc(r.nombre)}">`:`<h2>${esc(r.nombre)} ${rolTag(r)}</h2>`}
    <div class="sub">${esc(r.puestoGE)||''}${r.cod?' · Cód. '+esc(r.cod):''}${E?' · modo edición':''}</div>
    ${(!E&&ne)?`<div class="aviso">Registro con ${ne} campo${ne>1?'s':''} modificado${ne>1?'s':''} respecto al Excel. <button class="btn sm" type="button" data-restore>Deshacer cambios</button></div>`:''}
  </div>
  <div class="db">
    ${SECCIONES.map(([t,fs])=>`<section><h3>${t}</h3><dl>${fs.map(f=>field(r,f,E)).join('')}</dl></section>`).join('')}
    ${compSection(r,E)}
  </div>
  ${E?'<div class="df"><button class="btn" type="button" data-cancel>Cancelar</button><button class="btn pri" type="submit">Guardar cambios</button></div>':''}
  </form>`;
}
function openDrawer(id){
  if(S.edit&&id!==S.cur&&!guardEdit())return;
  S.cur=id; S.edit=false; renderDrawer(); const d=$('#drawer'); d.classList.add('open'); d.setAttribute('aria-hidden','false'); document.body.classList.add('drawer-open');
  $$('#tbody tr').forEach(tr=>tr.classList.toggle('sel',tr.dataset.id===id));
}
function closeDrawer(){
  if(S.edit&&!guardEdit())return;
  const d=$('#drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); document.body.classList.remove('drawer-open'); S.cur=null; S.edit=false;
  $$('#tbody tr.sel').forEach(tr=>tr.classList.remove('sel'));
}
/* --- edición --- */
function readForm(){
  const v={}; $$('#editForm [name]').forEach(el=>{
    let x=el.value.trim(), k=el.name;
    if(k==='horas'){const n=parseFloat(x.replace(',','.')); x=(isFinite(n)&&n>0)?n:null;}
    else if(k==='mail')x=x.toLowerCase(); else if(k==='dni'||k==='grupo')x=x.toUpperCase();
    v[k]=x;
  }); return v;
}
const cmpBase=(r,k)=>k==='motivo'?r.motivoEf:(r[k]??'');
function formDirty(){ const r=ALL.find(x=>x.id===S.cur); if(!r||!$('#editForm [name]'))return false; const v=readForm(); return Object.keys(v).some(k=>!eq(cmpBase(r,k),v[k])); }
function guardEdit(){ if(!S.edit)return true; if(formDirty()&&!confirm('Hay cambios sin guardar. ¿Descartarlos?'))return false; S.edit=false; return true; }
function setField(base,k,v){
  if(eq(base[k],v))return false;
  base.orig=base.orig||{}; if(!(k in base.orig))base.orig[k]=base[k];
  base[k]=v; if(eq(base.orig[k],v))delete base.orig[k];
  if(!Object.keys(base.orig).length)delete base.orig; return true;
}
async function saveEdit(){
  const r=ALL.find(x=>x.id===S.cur); if(!r)return; const vals=readForm();
  if(!vals.nombre){toast('El nombre no puede quedar vacío');return;}
  const base=baseOf(r); let n=0; const ids=[r.id];
  for(const k in vals){
    if(eq(cmpBase(r,k),vals[k]))continue; n++;
    setField(base,k,vals[k]);
    if(k==='motivo')r.compartido.forEach(o=>{setField(baseOf(o),'motivo',vals[k]);ids.push(o.id);});
  }
  S.edit=false; if(!n){toast('Sin cambios');renderDrawer();return;}
  rebuild(); if(await guardar(ids))toast('Cambios guardados');
}
async function restore(){
  const r=ALL.find(x=>x.id===S.cur); if(!r||!editado(r))return;
  if(!confirm('¿Deshacer todos los cambios de este registro y volver a los datos del Excel?'))return;
  const base=baseOf(r), motivoAntes=base.motivo, otros=r.compartido.map(baseOf);
  for(const k in base.orig)base[k]=base.orig[k]; delete base.orig;
  otros.forEach(o=>{ if(o.orig&&('motivo' in o.orig)&&eq(o.motivo,motivoAntes)){ o.motivo=o.orig.motivo; delete o.orig.motivo; if(!Object.keys(o.orig).length)delete o.orig; } });
  rebuild(); if(await guardar([r.id,...otros.map(o=>o.id)]))toast('Registro restaurado');
}
async function copiar(t){
  try{await navigator.clipboard.writeText(t);}
  catch{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch{}a.remove();}
  toast('Copiado');
}
$('#drawer').addEventListener('submit',e=>{ e.preventDefault(); if(S.edit)saveEdit(); });
$('#drawer').addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-close]'))return closeDrawer();
  if(t.closest('[data-edit]')){ S.edit=true; renderDrawer(); const f=$('#editForm input[name=puestoGE]'); if(f)f.focus(); return; }
  if(t.closest('[data-cancel]')){ if(guardEdit()){S.edit=false;renderDrawer();} return; }
  if(t.closest('[data-restore]'))return restore();
  const c=t.closest('[data-copy]'); if(c)return copiar(c.dataset.copy);
  const o=t.closest('[data-open]'); if(o){ const r=ALL.find(x=>x.id===o.dataset.open); if(r&&!LIST.includes(r)&&!S.edit)limpiar(); return openDrawer(o.dataset.open); }
  const n=t.closest('[data-nav]'); if(n&&!n.disabled){
    const i=LIST.findIndex(x=>x.id===S.cur)+(+n.dataset.nav); if(LIST[i]){openDrawer(LIST[i].id); const tr=$(`#tbody tr[data-id="${LIST[i].id}"]`); if(tr)tr.scrollIntoView({block:'nearest'});}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(S.pop)return closePop();
  const m=$('#colMenu'); if(m)return m.remove();
  if($('#drawer').classList.contains('open'))closeDrawer();
});

/* ============ Exportar ============ */
$('#btnExport').addEventListener('click',()=>{
  if(typeof XLSX==='undefined'){toast('La librería de Excel no está cargada');return;}
  const data=LIST.map(r=>({'Responsable':r.resp,'Puesto G.E.':r.puestoGE,'Código':r.cod,'Nombre':r.nombre,'Obs.':r.obs,'Fecha obs.':fmtFecha(r.obsFecha),
    'Puesto compartido':ROL[r.rolEf]||(r.compartido.length?'Sin determinar':''),'Motivo (puesto compartido)':r.motivoEf,
    'Correo':r.mail,'Móvil':r.movil,'DNI':r.dni,'Puesto de trabajo':r.puesto,'Grupo':r.grupo,'Centro de trabajo':r.centro,'Dirección':r.direccion,
    'Festivo local':r.localidad,'Puesto de prevención':r.prevencion,'Horas':r.horas==null?'':r.horas,'Tipo de contrato':r.contrato,'Coordinación':r.coord,
    'Encargo':r.encargoKey,'Acción':r.encargoNombre,'Titulación':r.titulacion,'Teletrabajo':r.teletrabajo,'Tarifa EPI':r.tarifa,
    'Expediente':r.expediente,'Nombre del encargo':r.nombreEncargo,'Fin del encargo':fmtFecha(r.fechaFin),'Editado en la app':editado(r)?'Sí':''}));
  const ws=XLSX.utils.json_to_sheet(data);
  ws['!cols']=Object.keys(data[0]||{}).map(k=>({wch:Math.min(45,Math.max(10,k.length+2,...data.slice(0,60).map(d=>String(d[k]).length)))}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Personal');
  const d=new Date(); XLSX.writeFile(wb,`personal_${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}.xlsx`);
  toast(`${data.length} trabajadores exportados`);
});

/* ============ Arranque: datos en tiempo real ============ */
(function init(){
  renderHead(); rebuild();
  const live=$('#live');
  try{
    firebase.initializeApp(firebaseConfig); fdb=firebase.firestore();
    fdb.collection(COL).onSnapshot(snap=>{
      BASE=snap.docs.map(d=>fromDoc(d.id,d.data()));
      live.className='live ok'; live.textContent='Datos en tiempo real';
      if(!S.edit)rebuild(); else renderInfo();
    },err=>{ console.error(err); live.className='live err'; live.textContent='Sin conexión con la base de datos ('+(err.code||err.message)+')'; });
  }catch(err){ console.error(err); live.className='live err'; live.textContent='No se pudo conectar con Firebase'; }
})();
</script>
